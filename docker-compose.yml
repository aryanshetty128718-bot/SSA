version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ssa_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssa_password}
      POSTGRES_DB: ${POSTGRES_DB:-smart_shopping_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssa_user} -d ${POSTGRES_DB:-smart_shopping_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional Adminer for DB inspection during demo
  adminer:
    image: adminer:latest
    container_name: ssa_adminer
    restart: always
    ports:
      - "8088:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
